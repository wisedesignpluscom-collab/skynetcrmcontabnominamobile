# Configuración de despliegue en Netlify para Nogui CRM (Next.js 16 + Prisma).
# La base de datos en producción es PostgreSQL (Neon); ver DEPLOY.md.

[build]
  # Deriva el esquema PostgreSQL, genera el cliente de Prisma para Linux y compila
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "20"

# Plugin oficial de Netlify para Next.js (App Router, server actions, middleware).
# Netlify lo instala automáticamente al detectar Next; se declara para dejarlo explícito.
[[plugins]]
  package = "@netlify/plugin-nextjs"
