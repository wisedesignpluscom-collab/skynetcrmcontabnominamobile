# Nogui CRM en un servidor local: la app + PostgreSQL, juntas.
# Levantar con:   docker compose up -d --build
# Requiere un archivo .env al lado (ver .env.server.example).

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: nogui
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nogui_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nogui -d nogui_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nogui:${DB_PASSWORD}@db:5432/nogui_crm?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      # Red local por HTTP (sin HTTPS): la cookie de sesión NO debe ser "secure"
      COOKIE_SECURE: "false"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
